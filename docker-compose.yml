networks:
  dev:

services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - '80:80'
      # - '80:443'
    volumes: 
      - './nginx.conf:/etc/nginx/nginx.conf'
    depends_on:
      - backend
      - frontend
      - postgres
      - redis
    networks:
      - dev

  backend:
    build:
      context: './backend'
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=shopigo
      - DB_USER=shopigo_user
      - DB_PASSWORD=shopigo_password
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
      - DB_SYNC_ALTER=true
    depends_on:
      - postgres
      - redis
    networks:
      - dev

  frontend:
    build:
      context: './frontend'
    networks:
      - dev

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=shopigo
      - POSTGRES_USER=shopigo_user
      - POSTGRES_PASSWORD=shopigo_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks:
      - dev

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    networks:
      - dev

volumes:
  postgres_data: